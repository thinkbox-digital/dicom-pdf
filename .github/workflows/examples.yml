name: Publish example archives

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-example-archives

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          lfs: true
      - name: Build and verify ZIP
        run: |
          mkdir -p target
          zip -qr target/dicom-pdf-examples.zip examples/
          unzip -tq target/dicom-pdf-examples.zip
      - name: Upload ZIP to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          gh release upload "$release_tag" target/dicom-pdf-examples.zip --clobber
